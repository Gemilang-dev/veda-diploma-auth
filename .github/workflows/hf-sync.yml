name: Sync to Hugging Face Hub
on:
  push:
    branches: [huggingface-backend]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload to Hugging Face using OIDC
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          
          api = HfApi()
          print('Starting upload to RayiAG/veda-backend-api...')
          try:
              api.upload_folder(
                  folder_path='.',
                  repo_id='RayiAG/veda-backend-api',
                  repo_type='space',
                  path_in_repo='',
                  ignore_patterns=['.git/*', '.github/*', 'venv/*', '__pycache__/*']
              )
              print('Upload successful!')
          except Exception as e:
              print(f'Error during upload: {e}')
              exit(1)
          "
