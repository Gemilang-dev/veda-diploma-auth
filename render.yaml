databases:
  - name: veda-db
    databaseName: veda
    user: veda_user
    plan: free

services:
  # 1. Backend API (FastAPI)
  - type: web
    name: veda-backend
    env: python
    buildCommand: pip install -r veda_backend/requirements.txt && python veda_backend/seed_db.py
    startCommand: gunicorn -w 4 -k uvicorn.workers.UvicornWorker veda_backend.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veda-db
          property: connectionString

  # 2. Frontend (React + Vite)
  - type: static
    name: veda-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: veda_frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: veda-backend
          property: url
