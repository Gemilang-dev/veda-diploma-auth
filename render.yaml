databases:
  - name: veda-db
    databaseName: veda
    user: veda_user
    plan: free

services:
  # Backend (FastAPI)
  - type: web
    name: veda-backend
    plan: free
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn veda_backend.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veda-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: WEB3_PROVIDER_URL
        value: https://rpc.ankr.com/eth_sepolia
      - key: PRIVATE_KEY
        sync: false
      - key: DIPLOMA_CONTRACT_ADDRESS
        sync: false
      - key: ISSUER_CONTRACT_ADDRESS
        sync: false

  # Frontend (Vite)
  - type: web
    name: veda-frontend
    plan: free
    env: static
    rootDir: veda_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: veda-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
